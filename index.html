<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Minimal To-Do</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
<main>
<div class="top"><button class="icon">☰</button><button class="icon">•••</button></div>
<h1>Today</h1><div class="date" id="currentDate"></div>
<div class="progress"><div class="bar"><div class="fill" id="progressFill"></div></div><div class="count" id="progressCount">0 / 0</div></div>
<div class="section">TODAY</div><div id="today"></div>
<div class="section overdue">OVERDUE</div><div id="overdue"></div>
</main>
<button class="fab" id="addButton">+</button>
<nav class="nav"><button class="active"><span>✓</span>Today</button><button><span>☷</span>Tasks</button><button><span>□</span>Calendar</button></nav>
<div class="sheet" id="sheet"><div class="modal"><div class="handle"></div><h2>Add Task</h2>
<input id="taskInput" class="input" placeholder="What needs to be done?" autocomplete="off">
<div class="row"><button class="chip">Today</button><button class="chip">6:00 PM</button><button class="chip">Medium</button></div>
<button class="add" id="saveTask">Add Task</button></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
